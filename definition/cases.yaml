# =============================================================================
# Coordination, as work the organization owns.
#
# Two kinds, and both are SHADOWS: they carry the state of coordinating
# something, not the thing itself. A `tarea` here is not the task somebody does
# — it is what this organization knows about that task: whose it is, what it is
# waiting on, whether it still matters.
#
# That distinction is load-bearing and it is why there is no `descripcion` of
# how to do anything, no checklist, no assignee workload, no estimates. Workflo
# is not the task manager. Where a task is actually executed and stored is a
# later slice's problem, and when it arrives it will be a hand-off over an
# Integration — not more fields here.
#
# What is NOT here, deliberately: deadlines, so no "late". "Late" needs a clock
# a Case can be measured against, and the deadline machinery exists but wiring
# it to coordination is a decision this slice does not need to make. The view
# that would want it is registered as missing rather than faked with a guess.
# =============================================================================

cases:

  proyecto:
    label: Proyecto
    goal: Llevar el proyecto a algo entregado, sabiendo siempre en qué anda.

    initial_state: activo

    states:
      - activo
      - en_pausa
      - cerrado

    transitions:
      activo: [en_pausa, cerrado]
      en_pausa: [activo, cerrado]
      cerrado: []

    goal_states: [cerrado]

    variables:
      nombre: string
      quien_lo_pidio: string
      nota: string

  tarea:
    label: Tarea
    goal: Que la tarea llegue a hecha, y que mientras tanto se sepa qué la traba.

    initial_state: por_hacer

    states:
      - por_hacer
      - en_curso
      - esperando       # bloqueada por algo que no depende de nosotros
      - hecha
      - descartada

    transitions:
      # Terminar desde acá, sin pasar por empezar: alguien la hizo y no avisó,
      # o dejó de hacer falta. Exigir que se declare empezada algo que ya está
      # hecho es pedir que se mienta para poder decir la verdad.
      por_hacer: [en_curso, esperando, hecha, descartada]
      en_curso: [esperando, hecha, por_hacer, descartada]
      esperando: [en_curso, hecha, descartada]
      hecha: []
      descartada: []

    goal_states: [hecha]

    # Trabajo que descansa acá está esperando a alguien de afuera, y el
    # operador tiene una vista propia para eso.
    awaits_input: [esperando]

    variables:
      titulo: string
      proyecto: string
      prioridad: string     # alta · normal — el orden del backlog
      # Para cuándo es, en día concreto: AAAA-MM-DD. Es lo único que una
      # herramienta puede recibir.
      vence: string
      # Lo que la persona dijo, tal cual: «el viernes», «fin de mes». Se guarda
      # además de la fecha porque es lo que dijo, y porque si la lectura sale
      # mal es lo único contra lo que se puede comprobar.
      plazo_dicho: string
      lectura_de_fecha: string
      # De quién es esta tarea. Guarda la clave de la persona en la plataforma,
      # no su nombre: dos personas contestan al mismo nombre y una persona se
      # escribe de cuatro formas, y una lista que pregunta «¿es mía?» no puede
      # apoyarse en eso. Lo que se muestra es el nombre; lo que se guarda, no.
      responsable: string
      esperando_a: string
      nota: string
      # Lo ÚNICO que Workflo guarda de la tarea que vive afuera: un handle
      # opaco, con quién lo emitió pegado adelante. Ni el título de allá, ni su
      # estado, ni una copia de nada. Dos sistemas guardando el mismo dato es
      # como uno de los dos empieza a estar equivocado.
      referencia_externa: string
      # Si esa entrega llegó de verdad: pending · retrying · delivered · failed.
      # Existe porque una entrega puede fallar por razones que no tienen nada
      # que ver con el trabajo, y un Case sin dónde anotarlo es un Case que
      # afirma en silencio que hay trabajo externo.
      entrega: string
      # Si el responsable llegó a la herramienta, o por qué no. Es distinto de
      # `entrega`: una tarea puede haber llegado perfecto y su dueño no, que es
      # lo que pasa la primera vez que se le da trabajo a alguien que todavía no
      # tiene cuenta ahí.
      asignacion_externa: string
      # Lo que el otro sistema dice que pasa con esa tarea. INFORMATIVO: no
      # mueve la coordinación. Que una tarea esté `done` allá no significa que
      # esta organización haya decidido que está hecha.
      standing_externo: string
      # Cuándo lo dijo, por el reloj del proveedor y no por el de llegada.
      ultimo_reflejo: string

    # -------------------------------------------------------------------------
    # El trabajo se entrega a quien lo ejecuta, y se lo mantiene al tanto.
    #
    # `to: task_manager` es un ROL. Cuál herramienta lo juega lo dice la
    # organización, y este archivo no puede enterarse.
    #
    # Los estados que se le cuentan son los cinco que TODO gestor de tareas
    # comparte: existe, alguien está en eso, algo la traba, terminó, no va. Más
    # fino que eso sería el vocabulario de una herramienta con nombre abstracto.
    # -------------------------------------------------------------------------
    hands_off:
      por_hacer:
        to: task_manager
        title: titulo
        detail: nota
        # De quién es, dicho con un fact PROPIO. La plataforma lo convierte en
        # una persona y cada herramienta traduce eso a lo suyo: este package no
        # sabe ni tiene por qué saber qué es un usuario de la herramienta que
        # esta organización eligió.
        assignee: responsable
        due: vence
        # Cuánto importa, traducido. `alta` y `normal` son palabras de esta
        # organización: la herramienta no las entiende y las guardaría como
        # texto que no puede ordenar. Acá se dice qué significan en los grados
        # que todo gestor comparte, igual que `reflects` hace con los estados.
        priority:
          from: prioridad
          means:
            # `alta` es la ÚNICA elevación que este vocabulario tiene, y la
            # palabra que la persona escribe es URGENTE. En los grados
            # compartidos eso es `urgent`, no `high`: significa que se salta la
            # fila, no que está un escalón arriba.
            alta: urgent
            # `normal` no se traduce a propósito. En este package quiere decir
            # «no es urgente», que no es lo mismo que «prioridad media»: si toda
            # tarea saliera con un grado medio, el tablero de la herramienta
            # diría lo mismo de todo y esta organización estaría afirmando algo
            # que nunca dijo. Una palabra sin traducir es «no hay nada que decir
            # sobre cuánto importa», que es una respuesta de verdad.
        records: referencia_externa
        records_delivery: entrega
        records_assignment: asignacion_externa
        unassigned_message: >-
          La anoté en la herramienta, pero sin responsable: esa persona no tiene
          cuenta ahí. Acá sigue siendo suya.
        records_standing: standing_externo
        records_synced_at: ultimo_reflejo
        failed_message: >
          No pudimos anotar esta tarea en la herramienta donde ejecutan. Quedó
          coordinada acá y hay que crearla a mano.

    # -------------------------------------------------------------------------
    # Lo que se dice cuando la herramienta hace algo.
    #
    # Dos frases y no más. Todo lo que pasa en el tablero se percibe y queda
    # escrito; contarlo entero sería un canal que alguien silencia en dos días, y
    # un canal silenciado es peor que uno vacío porque parece cobertura.
    #
    # Estas dos cambian lo que una persona haría después: una tarea que ya no
    # está allá deja de reflejar nada, y una que allá terminaron y acá sigue
    # abierta es la pregunta «¿la cerramos?» que si no aparece no la hace nadie.
    #
    # Lo demás —que la muevan de columna, que le cambien la descripción— se
    # percibe y se calla. Y lo que todavía no se puede decir es lo que la vuelta
    # no trae: quién quedó a cargo allá, y qué fecha le pusieron.
    # -------------------------------------------------------------------------
    when_the_tool_says:
      removed: >-
        Alguien borró esta tarea en la herramienta. Acá sigue: si ya no va,
        márcala HECHO.
      done: >-
        La marcaron terminada en la herramienta y acá sigue abierta. Si está
        lista, escribe HECHO y el número.

    reflects:
      en_curso:
        to: task_manager
        standing: in_progress
      esperando:
        to: task_manager
        standing: blocked
      hecha:
        to: task_manager
        standing: done
      descartada:
        to: task_manager
        standing: cancelled

  # ===========================================================================
  # Lo que alguien contó, antes de ser trabajo.
  #
  # Un `encargo` NO es una tarea. Es el estado de una pregunta: ¿esto que me
  # contaron es trabajo que tomamos, es algo que hay que aclarar, o es
  # información y nada más? Existe porque esa pregunta tiene que poder quedar
  # abierta, ser perseguida y ser respondida por una persona — y una `tarea`
  # que naciera directamente de una nota se iría a la herramienta de ejecución
  # antes de que nadie la juzgara.
  #
  # Cuando la respuesta es que sí, ENGENDRA una tarea y termina. Dos vidas, no
  # una: entender qué nos pidieron se acaba cuando se decide; hacerlo no empezó.
  #
  # Una nota, un encargo, UNA tarea. Que una reunión mencione cuatro cosas y
  # esto abra una sola no es un descuido — `spawns` engendra una pieza de
  # trabajo, y forzar varias sería inventar una primitiva sin evidencia. Cuando
  # el operador vea que quería cuatro, esa será la evidencia.
  # ===========================================================================
  encargo:
    label: Encargo
    goal: Que lo que alguien contó se vuelva trabajo que avanza, o quede descartado a sabiendas.

    initial_state: decidible

    states:
      - decidible
      - incompleto      # falta algo para poder juzgarlo
      - esperando       # se lo preguntamos y no contestaron
      - por_aprobar     # el juicio está hecho y espera a una persona
      # Esperando a otra área de esta organización. NO está en `awaits_input`:
      # eso es para trabajo trabado en alguien de AFUERA, y confundir las dos
      # cosas borra la única distinción que ese bloque existe para hacer.
      - esperando_presupuesto
      # El número llegó. El encargo sigue abierto porque todavía no es ni
      # trabajo que avanza ni algo descartado a sabiendas — que es su meta.
      - presupuestado
      - aceptado
      - descartado
      - sin_respuesta

    transitions:
      decidible: [incompleto, por_aprobar, aceptado, descartado, esperando_presupuesto]
      incompleto: [esperando]
      esperando: [decidible, incompleto, sin_respuesta]
      # Cada rama del juicio tiene que poder ejecutarse DESPUÉS de que una
      # persona la apruebe, no sólo antes. Una rama sin salida desde acá es
      # trabajo que se aprueba y queda trabado.
      por_aprobar: [aceptado, incompleto, descartado, decidible, esperando_presupuesto]
      esperando_presupuesto: [presupuestado, descartado]
      presupuestado: [aceptado, descartado]
      aceptado: []
      descartado: []
      sin_respuesta: []

    # `sin_respuesta` también termina, y por eso está acá. No es un logro —
    # nadie consiguió nada— pero es un final: desde ahí no hay a dónde moverse.
    # Dejarlo afuera lo mantenía ABIERTO para siempre, y un encargo abierto que
    # ya no puede avanzar sigue compitiendo por cada comando que llega: la
    # plataforma encuentra dos piezas de trabajo que reclaman lo mismo, no elige
    # —con razón— y el canal se queda mudo. Un final que no cierra no es un
    # final, es una piedra en el camino.
    goal_states: [aceptado, descartado, sin_respuesta]

    awaits_input: [esperando]

    variables:
      # Lo que se escribió, tal cual, menos la palabra que lo abrió. Se guarda
      # porque es la única fuente: lo demás son campos que alguien leyó de acá,
      # y una lectura sin el original al lado no se puede revisar.
      nota_cruda: string
      titulo: string
      cliente: string
      objetivo: string
      alcance: string
      plazo: string
      # La misma fecha resuelta a un día concreto, para que la tarea que nazca
      # de esto la reciba.
      vence: string
      # Lo que se leyó de la nota, tal como se leyó. No es el juicio: es el
      # material sobre el que el juicio se apoya, y queda para que alguien
      # pueda ver qué entendió la plataforma antes de proponer nada.
      lectura: string
      # Lo último que el operador contestó, tal cual. Igual que `nota_cruda`:
      # los campos son una LECTURA de esto, y una lectura sin el original al
      # lado no se puede revisar.
      respuesta_del_operador: string
      pregunta_pendiente: string
      intentos_de_contacto: number
      disposicion_propuesta: string
      motivo_de_la_propuesta: string
      # Lo que volvió del presupuesto. Cuatro hechos y no un documento: lo que
      # esta organización necesita saber para seguir es cuánto, en qué, hasta
      # cuándo y por qué. Un PDF es otra conversación y todavía no la tuvimos.
      presupuesto_monto: number
      presupuesto_moneda: string
      presupuesto_validez: string
      presupuesto_resumen: string

    # -------------------------------------------------------------------------
    # Falta algo, y preguntarlo bien es lo menos peligroso que se le puede pedir
    # a un modelo: lo peor que puede pasar es una frase torpe, y la pregunta
    # escrita está ahí abajo como respuesta determinista.
    # -------------------------------------------------------------------------
    asks:
      incompleto:
        question: ¿Nos cuentas un poco más? Me quedó claro que hay algo para hacer, pero no para quién ni para cuándo.
        records: pregunta_pendiente
        reason:
          # La instrucción acota la pregunta a los campos que este case type
          # declara, y no por prolijidad: una pregunta sobre algo que no es un
          # campo es una pregunta cuya respuesta no tiene dónde guardarse, y
          # entonces no puede dejar de hacerse nunca. Preguntar «¿cuántas horas
          # podemos dedicarle?» produjo exactamente ese bucle en la primera
          # corrida real.
          #
          # Y UNA cosa, no dos: «¿la fecha exacta Y cuántos perfiles?» se
          # contesta a medias, y lo que quedó a medias se vuelve a preguntar.
          instruction: >
            Falta un dato para decidir si tomamos este trabajo. Revisa cuál de
            estos está vacío o es impreciso — quién lo pide, qué hay que hacer,
            con qué alcance, para cuándo — y pide UNO SOLO, el más importante de
            los que falten.
            Pregunta únicamente por eso: no preguntes por presupuesto, por horas
            disponibles, por quién lo va a hacer ni por nada que dependa de
            nosotros y no de quien lo pidió.
            Una sola oración, breve. No saludes, no expliques, no agradezcas:
            sólo la pregunta.
          # `nota_cruda` va PRIMERO, y es la corrección que importa. Cuando la
          # lectura falla los cinco campos quedan vacíos, así que el modelo que
          # escribe la pregunta no tiene nada y pide lo primero que se le
          # ocurre — le pasó a un operador que había escrito la fecha en la
          # nota y recibió «¿cuál es la fecha límite de entrega?».
          #
          # No la estaba ignorando: no la podía ver. Sus palabras están en el
          # Case y no estaban entre lo que se le mostraba.
          reads: [nota_cruda, titulo, cliente, objetivo, alcance, plazo]
          max_length: 240
        then: esperando
        chase:
          after: 24h
          attempts: 2
          records: intentos_de_contacto
          message: ¿Seguimos con esto? Quedó pendiente un dato para poder decidir si lo tomamos.
          gives_up: sin_respuesta

    # -------------------------------------------------------------------------
    # El juicio, sobre una lista cerrada que escribió esta organización.
    #
    # ## Quien juzga acá no es quien pone los precios
    #
    # De la primera corrida real: «nos pidieron presupuesto» se juzgó `aceptar`,
    # con el motivo de que lo que hay que entregar ES el presupuesto — así que
    # abrió una tarea para armarlo. Coherente, y equivocado: armar la cotización
    # es de otra parte de la organización, y este juicio decide qué hacer con lo
    # que alguien contó, no cómo se hace.
    #
    # Por eso la instrucción ahora pregunta primero QUÉ están pidiendo. Si piden
    # un precio, se pide el precio; si piden que hagamos algo, se abre trabajo.
    # Son dos cosas distintas y la frase que las confunde —«necesito un
    # presupuesto»— es la más común que entra por este canal.
    #
    # `proposes` es la regla determinista, y no está de adorno: es lo que decide
    # cuando no hay modelo, cuando la organización no paga por uno, cuando el
    # proveedor no contesta o cuando lo que contesta no tiene la forma pedida.
    # Aclarar es la respuesta prudente por defecto — preguntar de más cuesta una
    # repregunta; tomar trabajo de más cuesta un compromiso.
    # -------------------------------------------------------------------------
    decides:
      decidible:
        proposes: aclarar
        # La instrucción tiene que decir CUÁNDO ALCANZA, y no lo decía. Un
        # modelo prolijo lee «decide qué corresponde» como «pregunta hasta estar
        # seguro», y de un trabajo de verdad nunca se está seguro: siempre queda
        # algo por precisar. La primera corrida real dio tres vueltas de
        # `aclarar` sobre un pedido que cualquier persona hubiera tomado.
        #
        # Un PM toma trabajo con el alcance a medias y lo precisa haciéndolo.
        # Eso no es descuido: es el oficio.
        reason:
          instruction: >
            Eres quien decide qué hacer con algo que alguien de la agencia
            contó después de una reunión.
            Primero decide QUÉ ES lo que están pidiendo, porque de eso depende
            todo lo demás.
            Elige `cotizar` si lo que piden es un PRECIO: un presupuesto, una
            cotización, cuánto sale, una propuesta económica. También si el
            trabajo se entiende pero nadie se puede comprometer sin saber
            cuánto cuesta.
            Poner precio NO es trabajo que hagas vos: se le pide a quien pone
            los precios y vuelve con el número. Por eso «hay que entregar un
            presupuesto» es `cotizar` y nunca `aceptar` — aceptar abriría una
            tarea para ejecutar algo, y armar una cotización no es eso.
            Elige `aceptar` si lo que piden es que HAGAMOS algo, y se sabe quién
            lo pide, qué hay que hacer y para cuándo — aunque el alcance no esté
            del todo definido. El detalle fino se precisa trabajando, no antes
            de empezar, y alguien va a revisar esta propuesta antes de que se
            abra nada.
            Elige `aclarar` sólo si falta algo SIN LO CUAL NO SE PUEDE EMPEZAR.
            No pidas más precisión sobre lo que ya se entiende, y no evalúes si
            tenemos tiempo, gente o presupuesto: eso es nuestro y no de quien
            pidió el trabajo.
            Elige `descartar` si no hay nada para hacer: es información.
          reads: [titulo, cliente, objetivo, alcance, plazo]
        held_in: por_aprobar
        records: disposicion_propuesta
        records_rationale: motivo_de_la_propuesta
        branches:
          aceptar:
            to: aceptado
            governance: require_approval
            means: Es trabajo para hacer y lo tomamos. Se abre una tarea y alguien la ejecuta.
          # Pedir el precio no compromete a esta organización con nadie, así
          # que no espera a una persona: lo que sí espera es la cotización que
          # salga de acá, y eso se aprueba en el presupuesto y no en el encargo.
          # Una aprobación por cada paso del mismo compromiso es una aprobación
          # que nadie lee.
          cotizar:
            to: esperando_presupuesto
            governance: allow
            means: Lo que hace falta acá es un precio. Se pide el presupuesto a quien los arma, y el encargo espera el número.
          aclarar:
            to: incompleto
            governance: allow
            means: Puede ser trabajo, pero falta algo para poder comprometerse.
          descartar:
            to: descartado
            governance: allow
            means: Es información, no algo para hacer. No se abre nada.

    # -------------------------------------------------------------------------
    # Un juicio retenido tiene que ANUNCIARSE.
    #
    # El acuse promete «te digo qué propongo» y durante cuatro versiones el
    # package no declaró nada acá: el sistema leía, juzgaba, retenía la
    # propuesta correctamente — y la persona no tenía cómo enterarse salvo
    # preguntando. Un juicio que espera a alguien que no sabe que lo esperan no
    # espera: se queda.
    #
    # El aviso señala y no lleva: `message` es texto fijo, así que no puede
    # decir QUÉ se propuso ni por qué. Eso se lee con QUE PROPUSE, que muestra
    # la propuesta con lo que significa y el motivo — que es lo que hay que
    # pesar antes de soltar nada.
    # -------------------------------------------------------------------------
    notify:
      por_aprobar:
        message: >-
          Tengo una propuesta para esto y está esperando que alguien decida.
          Escribe QUE PROPUSE para verla, o APROBADO para soltarla.
      # Esperar a otra área no puede ser en silencio. El acuse de la nota
      # promete «te digo qué propongo», y sin esto la propuesta era abrir un
      # presupuesto que nadie sabía que existía: el trabajo quedaba esperando
      # una acción de una persona a la que nadie se la pidió.
      esperando_presupuesto:
        message: >-
          Esto necesita precio antes de comprometernos, así que abrí un
          presupuesto. Escribe COTIZO seguido de cuánto sale.
      # Volvió el número. El aviso señala y no lleva —`message` es texto fijo,
      # igual que el de arriba— así que dice que llegó, no cuánto. Quien cotizó
      # ya vio el monto en el acuse de su propio COTIZO.
      presupuestado:
        message: >-
          Ya tengo el presupuesto de este encargo. Quedó anotado con el monto,
          la moneda y hasta cuándo vale.

    # -------------------------------------------------------------------------
    # Aceptado, empieza el trabajo. La tarea nace en `por_hacer`, donde el
    # `hands_off` que ya existía la entrega a la herramienta que ejecuta — sin
    # que este bloque sepa cuál es ni que exista.
    # -------------------------------------------------------------------------
    spawns:
      # Ponerle precio a algo es trabajo con su propia meta, su propio juicio y
      # su propia aprobación — no un estado del encargo. Por eso nace como
      # trabajo aparte y el encargo espera, en vez de que el encargo intente ser
      # dos cosas a la vez.
      esperando_presupuesto:
        opens: presupuesto
        carries:
          titulo: titulo
          cliente: cliente
          pedido: alcance
      aceptado:
        opens: tarea
        carries:
          titulo: titulo
          nota: alcance
          # La fecha que la nota ya traía deja de perderse. La extracción la
          # resolvió a un día concreto cuando se leyó la reunión; hasta ahora
          # ese dato moría en el encargo y la tarea nacía sin plazo.
          vence: vence
          plazo_dicho: plazo

    # -------------------------------------------------------------------------
    # Un juicio que espera a una persona no espera para siempre. A los dos días
    # vuelve a decidirse: puede haber llegado más información, y la alternativa
    # es una propuesta colgada que nadie mira y nada mueve.
    # -------------------------------------------------------------------------
    deadline:
      por_aprobar:
        after: 48h
        then: decidible

  # ===========================================================================
  # PRESUPUESTO — ponerle precio a algo que se pidió.
  #
  # Nace de un encargo que no se puede tomar sin saber cuánto sale, y termina
  # devolviéndole el número a ese mismo encargo. Entre una cosa y la otra tiene
  # su propia meta, su propio juicio y su propia aprobación, que es exactamente
  # por qué es trabajo aparte y no un estado del encargo: dos piezas de trabajo
  # con metas distintas no son una que cambia de idea.
  #
  # ## Cuatro hechos, no un documento
  #
  # Cuánto, en qué moneda, hasta cuándo vale y qué incluye. Eso es lo que esta
  # organización necesita saber para seguir. Un PDF, líneas de detalle, impuestos
  # o un catálogo son otra conversación y todavía nadie la pidió — y el día que
  # se pida, se pide sobre esto, no en lugar de esto.
  # ===========================================================================
  presupuesto:
    label: Presupuesto
    goal: Ponerle un número a lo que se pidió, y que quien lo pidió lo tenga.

    initial_state: por_cotizar

    states:
      - por_cotizar     # nació, y nadie le puso número todavía
      - decidible       # ya tiene número: se puede juzgar si responde al pedido
      - por_aprobar     # el juicio está hecho y espera a una persona
      # Aprobado NO es el final, y esa es la corrección. Un presupuesto que
      # alguien aprobó y todavía no salió es información que esta organización
      # necesita: es plata parada esperando que alguien apriete enviar. Si
      # terminara acá el Case se cerraría, y un Case cerrado no acepta comandos
      # — no habría dónde anotar que se envió.
      - aprobado
      - enviado
      - descartado

    transitions:
      por_cotizar: [decidible, descartado]
      decidible: [por_aprobar, aprobado, descartado, por_cotizar]
      # Cada rama del juicio tiene que poder ejecutarse DESPUÉS de que alguien
      # la apruebe, no sólo antes. La misma regla que el encargo, por la misma
      # razón: una rama sin salida desde acá es trabajo que se aprueba y queda
      # trabado.
      por_aprobar: [aprobado, descartado, por_cotizar, decidible]
      # Un presupuesto aprobado se manda o se cae; lo que no hace es volver a
      # cotizarse sin volver a aprobarse.
      aprobado: [enviado, descartado]
      enviado: []
      descartado: []

    # Enviar es el final: hasta que el número no salió de esta organización, el
    # presupuesto no cumplió su meta — que es que quien lo pidió lo tenga.
    goal_states: [enviado, descartado]

    variables:
      # Lo que el encargo pidió, para que quien cotiza no tenga que ir a
      # buscarlo. Copiado al nacer, no consultado después: el presupuesto
      # cotiza lo que se le pidió, aunque el encargo cambie mientras tanto.
      titulo: string
      cliente: string
      pedido: string
      # Lo que alguien escribió al cotizar, tal cual. Los cuatro de abajo son
      # una LECTURA de esto, y una lectura sin el original al lado no se puede
      # revisar.
      cotizacion_cruda: string
      lectura_de_la_cotizacion: string
      # Cuánto sale. Un número de verdad: un monto guardado como texto no se
      # puede sumar, ordenar ni comparar, y el día que alguien quiera saber
      # cuánto cotizó este mes ya sería tarde para arreglarlo.
      monto: number
      moneda: string
      validez: string
      resumen: string
      disposicion_propuesta: string
      motivo_de_la_propuesta: string
      # Que salió. Un hecho y ninguna integración: quién lo mandó y por dónde es
      # asunto de quien lo mandó, y esta organización todavía manda sus
      # presupuestos a mano.
      #
      # CUÁNDO salió no se guarda acá a propósito: el stream del Case ya lo
      # sabe, con la hora del evento que lo movió. Un hecho con la fecha sería
      # una segunda respuesta a la misma pregunta, y dos respuestas es como una
      # empieza a estar mal.
      envio: string

    # -------------------------------------------------------------------------
    # El juicio: ¿este número responde a lo que se pidió?
    #
    # Sobre una lista cerrada, con la misma forma que el juicio del encargo — y
    # `proposes` es la regla determinista para cuando no hay modelo, no hay
    # presupuesto de razonamiento o el proveedor no contesta. Sostener es lo
    # prudente por defecto: quien puso el número lo puso mirando el pedido, y
    # una persona lo aprueba después.
    # -------------------------------------------------------------------------
    decides:
      decidible:
        proposes: sostener
        reason:
          instruction: >
            Alguien de la agencia le puso precio a un trabajo que un cliente
            pidió. Decide qué corresponde hacer con esa cotización.
            Elige `sostener` si el número, la moneda y lo que incluye
            responden a lo que se pidió — aunque el detalle fino no esté
            cerrado. No evalúes si el precio es alto o bajo: eso lo decide
            quien aprueba, y no es tuyo.
            Elige `rehacer` sólo si falta un dato sin el cual la cotización no
            se puede sostener, o si lo cotizado no es lo que pidieron.
            Elige `no_cotizar` si no hay nada que cotizar acá.
          reads: [pedido, monto, moneda, validez, resumen]
        held_in: por_aprobar
        records: disposicion_propuesta
        records_rationale: motivo_de_la_propuesta
        branches:
          # La única rama retenida, y la única que hace falta: aprobar el
          # número ES aprobar el compromiso. Volver a cotizar o no cotizar no
          # comprometen a nadie.
          sostener:
            to: aprobado
            governance: require_approval
            means: El número responde a lo que se pidió. Queda aprobado y vuelve al encargo.
          rehacer:
            to: por_cotizar
            governance: allow
            means: Falta un dato o lo cotizado no es lo que pidieron. Se cotiza de nuevo.
          no_cotizar:
            to: descartado
            governance: allow
            means: No hay nada que cotizar acá. El encargo sigue sin número.

    notify:
      por_aprobar:
        message: >-
          Tengo un presupuesto listo y está esperando que alguien decida.
          Escribe APROBADO para soltarlo.

    # -------------------------------------------------------------------------
    # Salió, y ahora hay que cobrarlo.
    #
    # Cuelga de `enviado` y de ningún otro estado, y eso no es una regla que
    # este bloque imponga: es dónde está escrito. Un presupuesto aprobado que
    # nadie mandó no tiene nada que cobrar, y uno que espera aprobación menos.
    # -------------------------------------------------------------------------
    spawns:
      enviado:
        opens: cobranza
        carries:
          titulo: titulo
          cliente: cliente
          monto: monto
          moneda: moneda

    # -------------------------------------------------------------------------
    # Y el número vuelve al encargo que lo pidió.
    #
    # Sólo desde `aprobado`: un presupuesto descartado no tiene nada que
    # devolver, y hacer que un descarte avanzara el encargo sería contarle una
    # cotización que nunca existió. El encargo espera en `esperando_presupuesto`
    # y sigue esperando — que es honesto: nadie le puso precio.
    # -------------------------------------------------------------------------
    reports:
      aprobado:
        carries:
          presupuesto_monto: monto
          presupuesto_moneda: moneda
          presupuesto_validez: validez
          presupuesto_resumen: resumen
        advances: presupuestado

  # ===========================================================================
  # COBRANZA — que lo que salió, entre.
  #
  # Nace de un presupuesto que se envió, y su meta es saber si se cobró. Nada
  # más: no hay facturación, ni pagos, ni conciliación bancaria, ni estado de
  # cuenta. Lo que esta organización necesita hoy es no olvidarse, y olvidarse es
  # lo que pasa cuando el seguimiento vive en la cabeza de alguien.
  #
  # ## Dos palabras nuevas, y ningún juicio
  #
  # COBRADO e INCOBRABLE. La pregunta dice qué escribir, así que contestar «sí» y
  # decir que entró son el mismo acto y no dos: un input aparte para la respuesta
  # habría sido una segunda forma de decir lo mismo, y la que sobra es siempre la
  # que alguien termina usando mal.
  #
  # Y no hay `decides`: sobre un cobro que nadie contestó, un modelo no puede
  # aportar nada que la persona no sepa mejor —si ese cliente siempre paga tarde,
  # si conviene llamar— y pagar razonamiento para que proponga «insistir» es
  # pagar por una obviedad. Dejar de preguntar y decirlo ES el escalamiento.
  #
  # ## A quién se le pregunta, y por qué a esa persona
  #
  # A quien coordina, no al cliente. Este package no tiene canal con el cliente
  # —está postergado a propósito— y declarar uno acá sería declarar una
  # integración que no existe. Así que el área pregunta hacia adentro: «¿esto ya
  # se cobró?», y vuelve a preguntar si nadie contesta.
  #
  # El día que haya canal con el cliente, la pregunta puede mudarse de
  # destinatario sin cambiar nada de lo que este trabajo significa.
  # ===========================================================================
  cobranza:
    label: Cobranza
    goal: Que lo que se presupuestó y salió, se cobre — o que se sepa que no.

    initial_state: por_cobrar

    states:
      - por_cobrar      # salió, y todavía nadie preguntó nada
      - preguntado      # se preguntó si entró, y no contestaron
      - por_decidir     # nadie contestó después de insistir: lo mira una persona
      - cobrado
      - incobrable

    transitions:
      por_cobrar: [preguntado, cobrado]
      # Que entró la termina. No contestar, después de insistir, la deja en
      # manos de una persona.
      preguntado: [cobrado, por_decidir]
      # Lo que una persona puede hacer con un cobro que nadie contestó: decir
      # que entró, darlo por perdido, o volver a preguntar.
      por_decidir: [cobrado, incobrable, por_cobrar]
      cobrado: []
      incobrable: []

    # Incobrable también termina. No es un logro —nadie consiguió nada— pero es
    # un final, y un final que no cierra deja trabajo abierto compitiendo por
    # cada comando que llega.
    goal_states: [cobrado, incobrable]

    # Trabado en alguien de afuera, y no es un tecnicismo: mientras se espera un
    # cobro el próximo movimiento es del cliente —pagar— y no de esta
    # organización. Que la respuesta entre por quien coordina es por dónde llega
    # la información, no quién tiene la pelota.
    awaits_input: [preguntado]

    variables:
      titulo: string
      cliente: string
      # Lo que se presupuestó, copiado al nacer. Copiado y no consultado: se
      # cobra lo que se mandó, aunque después alguien recotice.
      monto: number
      moneda: string
      # Cuál es la pregunta abierta, vacío cuando no hay ninguna. Lo que hace
      # que un mensaje sea una RESPUESTA y no la próxima cosa que alguien dijo.
      pregunta_pendiente: string
      # Cuántas veces volvimos por la respuesta.
      intentos_de_cobro: number

    # -------------------------------------------------------------------------
    # Preguntar, y volver a preguntar.
    #
    # La pregunta es escrita y no razonada: preguntar si entró la plata no tiene
    # matices, y un modelo redactándola sería gastar razonamiento en una frase
    # que siempre dice lo mismo.
    #
    # Siete días, no uno: perseguir un cobro cada mañana es acoso, y quien cobra
    # sabe que una transferencia tarda. Dos intentos, como todo lo demás que esta
    # organización persigue.
    # -------------------------------------------------------------------------
    asks:
      por_cobrar:
        question: ¿Ya cobramos esto? Escribe COBRADO y el número si ya entró.
        records: pregunta_pendiente
        then: preguntado
        chase:
          after: 7d
          attempts: 2
          records: intentos_de_cobro
          message: ¿Seguimos esperando este cobro? Escribe COBRADO y el número si ya entró.
          gives_up: por_decidir

    # -------------------------------------------------------------------------
    # Dejar de preguntar tiene que decirse.
    #
    # Y esto es el escalamiento entero: el trabajo queda esperando a una persona,
    # y esa persona se entera. Sin palabra para escalar y sin un juicio que
    # proponga algo — el aviso dice qué se puede hacer, y las dos cosas que se
    # pueden hacer son palabras que ya existen.
    # -------------------------------------------------------------------------
    notify:
      por_decidir:
        message: >-
          Este cobro lleva tiempo sin respuesta y dejé de preguntar. Escribe
          COBRADO y el número si ya entró, o INCOBRABLE si no va a entrar.
