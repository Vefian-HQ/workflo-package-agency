# =============================================================================
# What arrives, and what it does to the work.
#
# Every one of these comes in `via: operator_channel` — a ROLE, never a medium.
# This package does not know and must not know which pipe an organization's
# people are reachable on. It knows that one of them is where its operators
# coordinate; the organization says which; the platform compares.
#
# That is the whole of the seam. Swapping the tool the operator talks through is
# a different answer to a configuration question and a different Adapter behind
# the connection — this file does not change, and cannot need to.
# =============================================================================

inputs:

  abrir_proyecto:
    label: Abrir un proyecto
    via: operator_channel
    from: operator
    opens: proyecto
    phrase: PROYECTO
    captures:
      nombre: rest
    acknowledge: Proyecto abierto.

  crear_tarea:
    label: Crear una tarea
    via: operator_channel
    from: operator
    opens: tarea
    phrase: TAREA
    captures:
      titulo: rest
    sets:
      prioridad: normal
    acknowledge: Tarea anotada.

  empezar_tarea:
    label: Empezar una tarea
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [por_hacer]
    phrase: EMPEZANDO
    refers_to: que_hago_ahora
    to: [en_curso]
    acknowledge: Anotado, está en curso.

  retomar_tarea:
    label: Se desbloqueó, la retomo
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [esperando]
    phrase: RETOMANDO
    # Otra vista, porque los renglones que el operador tiene delante cuando dice
    # esto son los de lo que estaba esperando. Un comando numera contra la lista
    # en la que el trabajo del que habla realmente aparece.
    refers_to: que_estoy_esperando
    to: [en_curso]
    acknowledge: Anotado, vuelve a estar en curso.

  trabar_tarea:
    label: La tarea está esperando algo
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [por_hacer, en_curso]
    phrase: ESPERANDO
    refers_to: que_hago_ahora
    captures:
      esperando_a: rest
    to: [esperando]
    acknowledge: Anotado, queda esperando.

  terminar_tarea:
    label: La tarea está hecha
    via: operator_channel
    from: operator
    advances: tarea
    # Nada salta de `por_hacer` a `hecha`: algo que nadie empezó y que ya está
    # hecho no pasó por acá, y la máquina de la tarea lo dice antes que nadie.
    when_state: [en_curso]
    phrase: HECHO
    refers_to: que_hago_ahora
    to: [hecha]
    acknowledge: Hecha.

  priorizar_tarea:
    label: Priorizar una tarea
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [por_hacer, en_curso]
    phrase: URGENTE
    refers_to: que_hago_ahora
    sets:
      prioridad: alta
    acknowledge: Listo, queda arriba.

  que_hago_ahora:
    label: ¿Qué hago ahora?
    via: operator_channel
    from: operator
    phrase: QUE HAGO
    answers_with: que_hago_ahora
    empty: No tienes nada pendiente.

  que_esta_pasando:
    label: ¿Qué está pasando?
    via: operator_channel
    from: operator
    phrase: QUE PASA
    answers_with: que_esta_pasando
    empty: No hay proyectos abiertos.

  que_dice_afuera:
    label: Lo que dice el sistema que ejecuta
    via: operator_channel
    from: operator
    phrase: QUE DICE
    # Preguntado en el momento, guardado por nadie. Apuntado a un renglón,
    # pregunta por esa tarea; apuntado a nada, pregunta por todas.
    lists: task_manager
    refers_to: que_hago_ahora
    empty: No hay nada del otro lado.
    unbound: Esta organización todavía no dijo dónde ejecuta su trabajo.

  que_estoy_esperando:
    label: ¿Qué estoy esperando?
    via: operator_channel
    from: operator
    phrase: QUE ESPERO
    answers_with: que_estoy_esperando
    empty: No estás esperando nada.

  # ===========================================================================
  # Lo que se habló, en prosa.
  #
  # Una palabra al principio y después lo que quieras. La palabra no está por
  # gusto: un opener sin frase reclama CUALQUIER mensaje del canal, y acá
  # competiría con TAREA y PROYECTO — cuál ganara dependería del orden en que
  # la plataforma recorre sus inputs, que no es una promesa que nadie hizo.
  #
  # `captures: rest` es lo que convierte la frase en un PREFIJO en vez de en el
  # mensaje entero: sin eso, `saysThePhrase` pide match exacto y esto sólo
  # matchearía a alguien que escribiera «NOTA» y nada más.
  #
  # El cuerpo del mensaje ES el documento. No hay un archivo adjunto ni un
  # formulario: alguien escribe lo que se dijo y la plataforma lo lee.
  # ===========================================================================
  nota_de_trabajo:
    label: Lo que se habló
    via: operator_channel
    from: operator
    opens: encargo
    phrase: NOTA
    captures:
      nota_cruda: rest
    extracts:
      from: text
      instruction: >
        Alguien de la agencia acaba de contar lo que se habló con un cliente o
        en una reunión interna. Extrae de lo que escribió qué hay que hacer,
        para quién, con qué alcance y para cuándo.
      fields:
        titulo: string
        cliente: string
        objetivo: string
        alcance: string
        plazo: string
      # Sin qué hay que hacer no hay nada que juzgar. Lo demás se puede
      # preguntar; esto no, porque sin eso no hay encargo.
      needs: [objetivo]
      min_confidence: 0.5
      records: lectura
      unusable: incompleto
    acknowledge: Lo leí. Te digo qué propongo.

  aprobar_encargo:
    label: Aprobar un encargo
    via: operator_channel
    from: operator
    # Un participio, no un infinitivo: el operador REPORTA que algo pasó, no le
    # imparte una orden a una herramienta. Es la misma forma de HECHO,
    # EMPEZANDO y ESPERANDO, y la razón es que del otro lado hay un colega.
    phrase: APROBADO
    advances: encargo
    confirms: decidible
    # Sin `refers_to` a propósito. Señalar una posición exige que el operador
    # escriba un número, y `confirms` ya sabe estrechar solo: de todo el trabajo
    # abierto, el único que una aprobación puede reclamar es el que está
    # RETENIDO esperándola. Si hubiera dos, la plataforma no elige — que es la
    # respuesta correcta a una frase que no dice cuál.
    acknowledge: Aprobado. Abro la tarea.

  que_propuse:
    label: ¿Qué propuse?
    via: operator_channel
    from: operator
    phrase: QUE PROPUSE
    answers_with: encargos_por_aprobar
    empty: No hay nada esperando que decidas.

  responder_lo_que_falta:
    label: La respuesta a lo que faltaba
    via: operator_channel
    from: operator
    # SIN frase, y es el punto. Preguntarle algo a alguien y después no aceptar
    # lo que contesta porque no le puso una palabra adelante no es una interfaz
    # estricta: es una maleducada. Pasó en la primera corrida real — el sistema
    # preguntó, el operador contestó como contesta cualquiera, y no pasó nada.
    #
    # La plataforma sólo llega acá cuando ninguna palabra reclamó el mensaje, y
    # sólo si hay exactamente una pregunta abierta para esta persona. Un HECHO
    # sigue siendo un HECHO aunque haya algo esperando respuesta.
    answers: incompleto
    advances: encargo
    to: [decidible]
    # `text`, el mensaje entero: sin frase adelante no hay «resto» que capturar.
    captures:
      respuesta_del_operador: text
    # La respuesta también se LEE. Es lo que hace que lo contestado aterrice en
    # el campo que contesta, en vez de en el que alguien eligió al escribir el
    # package.
    extracts:
      from: text
      instruction: >
        Esto es la respuesta a algo que preguntamos sobre un trabajo que nos
        pidieron. Extrae únicamente lo que la respuesta diga de verdad: quién lo
        pide, qué hay que hacer, con qué alcance y para cuándo. Lo que no
        mencione, no lo inventes.
      fields:
        titulo: string
        cliente: string
        objetivo: string
        alcance: string
        plazo: string
      # Sin `needs`: una respuesta que sólo trae la fecha es una buena
      # respuesta. Exigir de nuevo el objetivo haría que toda respuesta parcial
      # fuera ilegible, que es la manera más rápida de volver al bucle.
      min_confidence: 0.4
      records: lectura
