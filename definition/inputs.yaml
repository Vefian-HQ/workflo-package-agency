# =============================================================================
# What arrives, and what it does to the work.
#
# Every one of these comes in `via: operator_channel` — a ROLE, never a medium.
# This package does not know and must not know which pipe an organization's
# people are reachable on. It knows that one of them is where its operators
# coordinate; the organization says which; the platform compares.
#
# That is the whole of the seam. Swapping the tool the operator talks through is
# a different answer to a configuration question and a different Adapter behind
# the connection — this file does not change, and cannot need to.
# =============================================================================

inputs:

  abrir_proyecto:
    label: Abrir un proyecto
    via: operator_channel
    from: operator
    opens: proyecto
    phrase: PROYECTO
    captures:
      nombre: rest
    acknowledge: Proyecto abierto.

  crear_tarea:
    label: Crear una tarea
    via: operator_channel
    from: operator
    opens: tarea
    phrase: TAREA
    captures:
      titulo: rest
      # Quien la anota se la queda. Es lo que hace una persona cuando escribe
      # «TAREA revisar el contrato»: no está llenando el backlog de la empresa,
      # está anotando algo que va a hacer. Si es de otro, ASIGNO la mueve.
      #
      # Lo que nace de un encargo NO pasa por acá y queda sin dueño, que también
      # es correcto: ahí nadie decidió todavía de quién es.
      responsable: me
    sets:
      prioridad: normal
    acknowledge: Tarea anotada.

  empezar_tarea:
    label: Empezar una tarea
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [por_hacer]
    phrase: EMPEZANDO
    refers_to: que_hago_ahora
    which_one: >-
      ¿Cuál? Dime el número que te mostró la lista, o el código entre
      corchetes.
    to: [en_curso]
    acknowledge: Anotado, está en curso.

  retomar_tarea:
    label: Se desbloqueó, la retomo
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [esperando]
    phrase: RETOMANDO
    # Otra vista, porque los renglones que el operador tiene delante cuando dice
    # esto son los de lo que estaba esperando. Un comando numera contra la lista
    # en la que el trabajo del que habla realmente aparece.
    refers_to: que_estoy_esperando
    which_one: >-
      ¿Cuál? Dime el número que te mostró la lista, o el código entre
      corchetes.
    to: [en_curso]
    acknowledge: Anotado, vuelve a estar en curso.

  trabar_tarea:
    label: La tarea está esperando algo
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [por_hacer, en_curso]
    phrase: ESPERANDO
    refers_to: que_hago_ahora
    which_one: >-
      ¿Cuál? Dime el número que te mostró la lista, o el código entre
      corchetes.
    captures:
      esperando_a: rest
    to: [esperando]
    acknowledge: Anotado, queda esperando.

  terminar_tarea:
    label: La tarea está hecha
    via: operator_channel
    from: operator
    advances: tarea
    # Nada salta de `por_hacer` a `hecha`: algo que nadie empezó y que ya está
    # hecho no pasó por acá, y la máquina de la tarea lo dice antes que nadie.
    when_state: [en_curso]
    phrase: HECHO
    refers_to: que_hago_ahora
    which_one: >-
      ¿Cuál? Dime el número que te mostró la lista, o el código entre
      corchetes.
    to: [hecha]
    acknowledge: Hecha.

  # -------------------------------------------------------------------------
  # Repartir el trabajo. Las dos únicas palabras que escriben un responsable, y
  # las dos apuntan a `todo_el_trabajo`: se toma y se reparte de la lista de
  # todos, no de la propia — de la propia ya es tuyo.
  #
  # El puntero va AL FINAL, como en toda palabra que lleva texto: «ASIGNO
  # @laura 2» y no «ASIGNO 2 @laura». La mención puede ir en cualquier lado
  # porque no se parsea: la plataforma busca si la dirección de alguien está en
  # lo que escribiste.
  # -------------------------------------------------------------------------
  tomar_tarea:
    label: Tomo esta tarea
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [por_hacer, en_curso, esperando]
    phrase: TOMO
    refers_to: todo_el_trabajo
    which_one: >-
      ¿Cuál? Dime el número que te mostró la lista, o el código entre
      corchetes.
    captures:
      responsable: me
    acknowledge: Anotado, queda tuya.

  asignar_tarea:
    label: Asigno esta tarea a alguien
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [por_hacer, en_curso, esperando]
    phrase: ASIGNO
    refers_to: todo_el_trabajo
    which_one: >-
      ¿Cuál? Dime el número que te mostró la lista, o el código entre
      corchetes.
    captures:
      responsable: mentioned
    acknowledge: Anotado, queda de esa persona.
    # Lo que pasa la primera vez que alguien menciona a un colega nuevo, que es
    # la mitad de las veces. Sin esto el área contestaba «queda de esa persona»
    # y la tarea conservaba el dueño que tenía: cada capa hacía lo correcto y a
    # la persona se le decía lo contrario de lo que pasó.
    unknown: >-
      No sé quién es esa persona. Tiene que estar dada de alta en Workflo y
      vinculada a su cuenta de este canal para poder pasarle trabajo.

  # -------------------------------------------------------------------------
  # La fecha, dicha como la dice una persona.
  #
  # Se lee con el mismo arco que el juicio, y hace ECO en vez de pedir
  # aprobación: retener una tarea para que alguien confirme «viernes» sería
  # pesado para algo que se dice diez veces por día, y el eco te muestra lo
  # entendido en el mismo segundo. Si leyó mal, lo escribes de nuevo.
  # -------------------------------------------------------------------------
  fechar_tarea:
    label: Esto es para tal día
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [por_hacer, en_curso, esperando]
    phrase: PARA
    refers_to: todo_el_trabajo
    which_one: >-
      ¿Cuál? Dime el número que te mostró la lista, o el código entre
      corchetes.
    captures:
      plazo_dicho: rest
    extracts:
      from: rest
      instruction: >
        Alguien dijo para cuándo es un trabajo. Resuélvelo a un día concreto en
        formato AAAA-MM-DD, usando el dato `hoy` para saber contra qué día
        resolver «el viernes», «mañana» o «fin de mes».
        Si lo que dijeron no permite fijar un día, deja el campo vacío: una
        fecha inventada es peor que ninguna.
      fields:
        vence: string
      needs: [vence]
      min_confidence: 0.3
      records: lectura_de_fecha
    acknowledge: Anotado, vence el {vence}.

  priorizar_tarea:
    label: Priorizar una tarea
    via: operator_channel
    from: operator
    advances: tarea
    when_state: [por_hacer, en_curso]
    phrase: URGENTE
    refers_to: todo_el_trabajo
    which_one: >-
      ¿Cuál? Dime el número que te mostró la lista, o el código entre
      corchetes.
    sets:
      prioridad: alta
    acknowledge: Listo, queda arriba.

  que_hago_ahora:
    label: ¿Qué hago ahora?
    via: operator_channel
    from: operator
    phrase: QUE HAGO
    answers_with: que_hago_ahora
    # Decir «nada» y callarse es correcto y sirve para nada: quien recién
    # empieza no tiene nada tomado, y la lista vacía es idéntica a la de quien
    # ya terminó todo.
    empty: No tienes nada tomado. Escribe QUE HAY para ver todo el trabajo, y TOMO seguido del número para quedarte con una.

  # La lista de todos, que es desde donde se reparte. Existe porque QUE HAGO
  # dejó de ser «todo»: sin esta, el trabajo sin dueño no lo vería nadie.
  que_hay:
    label: ¿Qué hay para hacer?
    via: operator_channel
    from: operator
    phrase: QUE HAY
    answers_with: todo_el_trabajo
    empty: No hay trabajo abierto.

  que_esta_pasando:
    label: ¿Qué está pasando?
    via: operator_channel
    from: operator
    phrase: QUE PASA
    answers_with: que_esta_pasando
    empty: No hay proyectos abiertos.

  que_dice_afuera:
    label: Lo que dice el sistema que ejecuta
    via: operator_channel
    from: operator
    phrase: QUE DICE
    # Preguntado en el momento, guardado por nadie. Apuntado a un renglón,
    # pregunta por esa tarea; apuntado a nada, pregunta por todas.
    lists: task_manager
    refers_to: que_hago_ahora
    which_one: >-
      ¿Cuál? Dime el número que te mostró la lista, o el código entre
      corchetes.
    empty: No hay nada del otro lado.
    unbound: Esta organización todavía no dijo dónde ejecuta su trabajo.
    # Preguntar y no obtener respuesta no es que no haya nada: es no saber.
    # Contestar `empty` ahí sería decir «del otro lado no hay nada» sobre una
    # pregunta que nadie respondió, y quien lee eso deja de buscar.
    unreachable: >-
      No pude preguntarle a la herramienta: no contestó. Intenta de nuevo en
      un momento.

  que_estoy_esperando:
    label: ¿Qué estoy esperando?
    via: operator_channel
    from: operator
    phrase: QUE ESPERO
    answers_with: que_estoy_esperando
    empty: No estás esperando nada.

  # ===========================================================================
  # Lo que se habló, en prosa.
  #
  # Una palabra al principio y después lo que quieras. La palabra no está por
  # gusto: un opener sin frase reclama CUALQUIER mensaje del canal, y acá
  # competiría con TAREA y PROYECTO — cuál ganara dependería del orden en que
  # la plataforma recorre sus inputs, que no es una promesa que nadie hizo.
  #
  # `captures: rest` es lo que convierte la frase en un PREFIJO en vez de en el
  # mensaje entero: sin eso, `saysThePhrase` pide match exacto y esto sólo
  # matchearía a alguien que escribiera «NOTA» y nada más.
  #
  # El cuerpo del mensaje ES el documento. No hay un archivo adjunto ni un
  # formulario: alguien escribe lo que se dijo y la plataforma lo lee.
  # ===========================================================================
  nota_de_trabajo:
    label: Lo que se habló
    via: operator_channel
    from: operator
    opens: encargo
    phrase: NOTA
    captures:
      nota_cruda: rest
    extracts:
      from: text
      instruction: >
        Alguien de la agencia acaba de contar lo que se habló con un cliente o
        en una reunión interna. Extrae de lo que escribió qué hay que hacer,
        para quién, con qué alcance y para cuándo.
        En `vence` pon esa misma fecha resuelta a un día concreto en formato
        AAAA-MM-DD, usando el dato `hoy` para saber contra qué día resolverla.
        Si lo que dijeron no permite fijar un día —«más adelante», «cuando se
        pueda»— deja `vence` vacío: una fecha inventada es peor que ninguna.
      fields:
        titulo: string
        cliente: string
        objetivo: string
        alcance: string
        plazo: string
        # La misma fecha, resuelta. `plazo` guarda lo que la persona dijo —
        # «fin de mes», «el viernes»— porque eso es lo que dijo; `vence` es el
        # día concreto, que es lo único que una herramienta puede recibir. La
        # plataforma le pasa a cada lectura qué día es hoy donde trabaja esta
        # organización, así que «el viernes» tiene contra qué resolverse.
        vence: string
      # Sin qué hay que hacer no hay nada que juzgar. Lo demás se puede
      # preguntar; esto no, porque sin eso no hay encargo.
      needs: [objetivo]
      # Opus vuelve conservador: en las primeras corridas reales las confianzas
      # llegaron en 0.50, 0.55 y 0.60, una rozando el límite. Con el umbral en
      # 0.5 cada nota era un volado — y como `needs` es todo-o-nada, un solo
      # campo flojo descartaba los cuatro que estaban bien.
      min_confidence: 0.3
      records: lectura
      unusable: incompleto
    acknowledge: Lo leí. Te digo qué propongo.

  aprobar_encargo:
    label: Aprobar un encargo
    via: operator_channel
    from: operator
    # Un participio, no un infinitivo: el operador REPORTA que algo pasó, no le
    # imparte una orden a una herramienta. Es la misma forma de HECHO,
    # EMPEZANDO y ESPERANDO, y la razón es que del otro lado hay un colega.
    phrase: APROBADO
    advances: encargo
    confirms: decidible
    # Sin `refers_to` a propósito. Señalar una posición exige que el operador
    # escriba un número, y `confirms` ya sabe estrechar solo: de todo el trabajo
    # abierto, el único que una aprobación puede reclamar es el que está
    # RETENIDO esperándola. Si hubiera dos, la plataforma no elige — que es la
    # respuesta correcta a una frase que no dice cuál.
    acknowledge: Aprobado. Abro la tarea.

  que_propuse:
    label: ¿Qué propuse?
    via: operator_channel
    from: operator
    phrase: QUE PROPUSE
    answers_with: encargos_por_aprobar
    empty: No hay nada esperando que decidas.

  responder_lo_que_falta:
    label: La respuesta a lo que faltaba
    via: operator_channel
    from: operator
    # SIN frase, y es el punto. Preguntarle algo a alguien y después no aceptar
    # lo que contesta porque no le puso una palabra adelante no es una interfaz
    # estricta: es una maleducada. Pasó en la primera corrida real — el sistema
    # preguntó, el operador contestó como contesta cualquiera, y no pasó nada.
    #
    # La plataforma sólo llega acá cuando ninguna palabra reclamó el mensaje, y
    # sólo si hay exactamente una pregunta abierta para esta persona. Un HECHO
    # sigue siendo un HECHO aunque haya algo esperando respuesta.
    answers: incompleto
    advances: encargo
    to: [decidible]
    # `text`, el mensaje entero: sin frase adelante no hay «resto» que capturar.
    captures:
      respuesta_del_operador: text
    # La respuesta también se LEE. Es lo que hace que lo contestado aterrice en
    # el campo que contesta, en vez de en el que alguien eligió al escribir el
    # package.
    extracts:
      from: text
      instruction: >
        Esto es la respuesta a algo que preguntamos sobre un trabajo que nos
        pidieron. Extrae únicamente lo que la respuesta diga de verdad: quién lo
        pide, qué hay que hacer, con qué alcance y para cuándo. En `vence` pon
        esa fecha resuelta a un día concreto en formato AAAA-MM-DD usando el
        dato `hoy`; si no alcanza para fijar un día, déjalo vacío. Lo que no
        mencione, no lo inventes.
      fields:
        titulo: string
        cliente: string
        objetivo: string
        alcance: string
        plazo: string
        # La misma fecha, resuelta. `plazo` guarda lo que la persona dijo —
        # «fin de mes», «el viernes»— porque eso es lo que dijo; `vence` es el
        # día concreto, que es lo único que una herramienta puede recibir. La
        # plataforma le pasa a cada lectura qué día es hoy donde trabaja esta
        # organización, así que «el viernes» tiene contra qué resolverse.
        vence: string
      # Sin `needs`: una respuesta que sólo trae la fecha es una buena
      # respuesta. Exigir de nuevo el objetivo haría que toda respuesta parcial
      # fuera ilegible, que es la manera más rápida de volver al bucle.
      min_confidence: 0.3
      records: lectura

  # ===========================================================================
  # Ponerle precio a lo que se pidió.
  #
  # Primera persona, como TOMO y ASIGNO: quien escribe reporta lo que hizo, no
  # le da una orden a nadie. Y en prosa, como PARA: un formulario de cuatro
  # campos para algo que se dice en una frase sería pedirle a una persona que
  # hable como una base de datos.
  # ===========================================================================
  cotizar_presupuesto:
    label: Ponerle precio
    via: operator_channel
    from: operator
    advances: presupuesto
    when_state: [por_cotizar]
    phrase: COTIZO
    captures:
      cotizacion_cruda: rest
    extracts:
      from: rest
      instruction: >
        Alguien de la agencia le puso precio a un trabajo. Extrae de lo que
        escribió cuánto sale, en qué moneda, hasta cuándo vale esa cotización y
        qué incluye.
        En `monto` pon sólo el número, sin símbolos ni separadores de miles.
        En `moneda` pon las tres letras del código si se puede deducir de lo que
        dijeron; si dijeron sólo «pesos» o «dólares» sin más, pon esa palabra
        tal cual y no adivines el país.
        En `validez` pon hasta cuándo vale, con las palabras que usaron.
        En `resumen` pon en una oración qué incluye ese precio.
        Si algo no lo dijeron, deja el campo vacío: un dato inventado en una
        cotización es peor que un dato que falta.
      fields:
        monto: number
        moneda: string
        validez: string
        resumen: string
      # Sin monto no hay cotización. Lo demás se puede completar después; esto
      # es lo único sin lo cual no hay nada que juzgar ni nada que devolver.
      needs: [monto]
      min_confidence: 0.3
      records: lectura_de_la_cotizacion
    to: [decidible]
    # El acuse dice el número que acaba de guardar, y eso importa más de lo que
    # parece: es la única vez que alguien lo ve escrito antes de aprobarlo.
    acknowledge: >-
      Anotado: {monto} {moneda}. Te digo qué propongo.

  # ===========================================================================
  # La misma palabra que suelta un juicio retenido en un encargo, sobre un
  # presupuesto.
  #
  # Es la palabra de esta organización para «sueltas lo que estaba retenido», y
  # significa lo mismo de los dos lados. Inventarle una segunda para el mismo
  # acto sería pedirle a una persona que recuerde de qué tipo de trabajo está
  # hablando antes de poder aprobarlo.
  #
  # Cada una alcanza sólo a su clase de trabajo, así que no compiten mientras no
  # haya un encargo Y un presupuesto retenidos a la vez. Ese caso es el
  # señalamiento ambiguo que ya está registrado, y no se resuelve acá.
  # ===========================================================================
  aprobar_presupuesto:
    label: Aprobar un presupuesto
    via: operator_channel
    from: operator
    phrase: APROBADO
    advances: presupuesto
    confirms: decidible
    acknowledge: Aprobado. El número vuelve al encargo.
