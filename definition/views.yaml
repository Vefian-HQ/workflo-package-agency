# =============================================================================
# Las tres preguntas que un operador hace todo el día.
#
# Falta una cuarta — "¿qué está atrasado?" — y no está porque no se puede
# responder honestamente todavía: atrasado necesita un plazo contra el cual
# medir, y esta coordinación no declara ninguno. Una vista que adivinara sería
# peor que no tenerla. Queda registrada como faltante, no fingida.
# =============================================================================

views:

  # La única vista que es de UNA persona, y por eso se llama así. `mine` dice
  # cuál de los facts de la tarea significa «de quién es»; quién pregunta lo
  # sabe la plataforma en el momento de abrirla, y este package no puede
  # saberlo ni tiene por qué.
  #
  # Consecuencia deliberada: lo que no tiene responsable no está acá. Trabajo
  # sin dueño visible en la lista de todos como si fuera tuyo es exactamente
  # como termina siendo de nadie. Para eso está `todo_el_trabajo`.
  que_hago_ahora:
    label: Qué hago ahora
    of: tarea
    mine: responsable
    while_state: [por_hacer, en_curso]
    show:
      - titulo
      - prioridad
      - proyecto
    order:
      - by: prioridad
        values: [alta, normal]
      - by: opened_at
        direction: asc

  # Todo lo que hay para hacer, de quien sea y de nadie. Es la lista desde la
  # que se reparte: muestra el responsable justamente porque la pregunta que se
  # le hace es «¿esto quién lo tiene?».
  todo_el_trabajo:
    label: Todo lo que hay
    of: tarea
    while_state: [por_hacer, en_curso]
    show:
      - titulo
      - responsable
      - prioridad
      - proyecto
    order:
      - by: prioridad
        values: [alta, normal]
      - by: opened_at
        direction: asc

  que_esta_pasando:
    label: Qué está pasando
    of: proyecto
    while_state: [activo, en_pausa]
    show:
      - nombre
      - quien_lo_pidio
    order:
      - by: opened_at
        direction: desc

  # También es tuya: se llama «estoy esperando», no «se está esperando».
  que_estoy_esperando:
    label: Qué estoy esperando
    of: tarea
    mine: responsable
    while_state: [esperando]
    show:
      - titulo
      - esperando_a
    order:
      - by: opened_at
        direction: asc

  no_se_entregaron:
    label: No llegaron a la herramienta
    of: tarea
    while_state: [por_hacer, en_curso, esperando]
    # Lo que Workflo coordina y el otro sistema todavía no tiene. Una entrega
    # que se dio por perdida aparece acá; una que todavía no salió también, y
    # eso es honesto: el trabajo está acá y no está allá.
    show:
      - titulo
      - entrega
    order:
      - by: opened_at
        direction: asc

  encargos_por_aprobar:
    label: Esperando que alguien decida
    of: encargo
    while_state: [por_aprobar]
    # El motivo va en la vista a propósito. Una propuesta que sólo dice qué
    # hacer obliga a confiar; una que dice sobre qué se apoyó se puede pesar, y
    # pesarla es exactamente lo que se le está pidiendo a la persona.
    show:
      - titulo
      - disposicion_propuesta
      - motivo_de_la_propuesta
    order:
      - by: opened_at
        direction: asc
