# =============================================================================
# workflo.yaml — the Agency package manifest
#
# The first package whose operator does not talk to it over a medium the package
# chose. It declares a ROLE — `operator_channel` — and the organization says
# which of its connections plays it.
#
# There is no provider name anywhere in this repository, and a test asserts it
# stays that way — including in the prose. A package that named a tool would be
# a package that has to be edited when the organization changes tools, which is
# the thing this whole arc exists to make impossible.
#
# 0.2.0 — el trabajo deja de llegar sólo como comandos. La plataforma lee lo que
# se habló en prosa, propone qué hacer sobre una lista cerrada que escribió esta
# organización, y una persona aprueba antes de que se abra nada. Ningún
# proveedor nuevo, ningún nombre de herramienta, y el camino de comandos que ya
# funcionaba queda intacto.
#
# 0.10.0 — la repregunta ve lo que la persona escribió. Cuando una lectura
# falla los campos quedan vacíos y quien escribe la pregunta se queda sin nada,
# así que pedía cosas que estaban a la vista en la nota. Ahora lee también la
# nota original. Y el umbral de confianza baja a 0.3: el modelo vuelve
# conservador y `needs` es todo-o-nada, así que un campo flojo se llevaba
# puestos a los cuatro que estaban bien.
#
# 0.9.0 — el package deja de decir en qué idioma se habla. Ni «rioplatense» ni
# «neutro»: cómo suena una organización es de la organización, igual que qué
# proveedor usa y qué modelo paga. La plataforma le pregunta una vez y compone
# la respuesta en cada instrucción. Este archivo declara significado y nada más.
#
# 0.8.0 — todo lo que esta organización le dice a una persona pasa a español
# neutro. Estaba en rioplatense por herencia de un fixture y por descuido de
# quien escribió encima: voseo en los mensajes, imperativos regionales en las
# instrucciones al modelo, y `encarar` como nombre de una rama. Un package que
# se instala en varios países no puede hablar como si se instalara en uno.
#
# 0.7.0 — el vocabulario se ordena y encoge. Contestar una pregunta ya no
# necesita palabra: la plataforma sabe que si te preguntó algo y escribís algo
# que no es un comando, eso es la respuesta. Y APROBAR pasa a APROBADO, para que
# todas las palabras que mueven trabajo digan lo que PASÓ en vez de dar una
# orden — del otro lado hay un colega, no una CLI.
#
# 0.6.0 — el juicio ahora dice cuándo alcanza. No lo decía, y un modelo prolijo
# lee «decide qué corresponde» como «pregunta hasta estar seguro»: la primera
# corrida real dio vueltas de `aclarar` sobre un pedido que cualquiera hubiera
# tomado. Un PM toma trabajo con el alcance grueso y lo precisa haciéndolo.
#
# 0.5.0 — rendirse también termina. `sin_respuesta` no estaba entre los estados
# de meta, así que un encargo que la plataforma dejó de perseguir quedaba
# ABIERTO para siempre — y seguía reclamando cada respuesta que llegaba, con lo
# que dos encargos vivos dejaban el canal mudo sin decir por qué.
#
# 0.4.0 — lo que se contesta se lee, en vez de volcarse en un campo que alguien
# eligió de antemano. La primera corrida real dio un bucle: el operador contestó
# la fecha cuatro veces y el sistema volvió a pedirla cuatro veces, porque la
# respuesta se archivaba como `alcance` y `plazo` seguía vacío. Y la repregunta
# se acota a los campos declarados: preguntar por algo que no es un campo es
# preguntar algo cuya respuesta no tiene dónde ir, y eso no termina nunca.
#
# 0.3.0 — la prosa entra por el mismo canal que los comandos, detrás de la
# palabra NOTA. Un rol de canal aparte era más limpio conceptualmente y le
# salía caro a la organización: la plataforma identifica una conexión por la
# dirección del webhook, así que una segunda sala puede costar una segunda
# integración entera. Cuál de sus conexiones es cuál sigue siendo pregunta de la
# organización; este archivo no sabe ni puede saber qué hay detrás. La palabra
# cuesta menos y dice lo mismo.
# =============================================================================

package: agency
version: 0.10.0

declares:
  cases: definition/cases.yaml
  inputs: definition/inputs.yaml
  views: definition/views.yaml
  configuration: definition/configuration.yaml
